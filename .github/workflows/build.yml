name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip XOZ_Pro_v3_Mobile_Project.zip -d project_files

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-project-files
          path: project_files/
          
